name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" Resources/Info.plist

      - name: Build installer
        run: ./make-installer.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub replaces spaces in asset names, so upload under a clean name.
          PKG="WeatherWallpaper-${GITHUB_REF_NAME}.pkg"
          cp "build/Weather Wallpaper Installer.pkg" "$PKG"
          gh release create "$GITHUB_REF_NAME" "$PKG" --title "$GITHUB_REF_NAME" --generate-notes
